version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: gmcompainion_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PostgresConfiguration__DataBase}
      POSTGRES_USER: ${PostgresConfiguration__User}
      POSTGRES_PASSWORD: ${PostgresConfiguration__Password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql  # <-- changed    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gmcompainion_api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gmcompainion_web
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
